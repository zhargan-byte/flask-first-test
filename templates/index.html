<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docker Flask Test</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#0ea5e9);
    overflow:hidden;
    perspective:1000px;
}

.container{
    perspective:1000px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.card{
    width:380px;
    height:450px;
    position:relative;
    transform-style:preserve-3d;
    animation:rotate 10s infinite linear;
}

.card:hover{
    animation-play-state:paused;
}

.face{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:25px;
    backdrop-filter:blur(3px);
    background:rgba(15, 23, 42, 0.7);
    border:2px solid rgba(255,255,255,0.3);
    box-shadow:0 0 30px rgba(0,0,0,0.5);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:#fff;
    text-align:center;
    padding:40px 30px;
    backface-visibility:hidden;
}

.face h1{
    font-size:2rem;
    margin-bottom:15px;
    font-weight:bold;
    text-shadow:0 2px 8px rgba(0,0,0,0.5);
}

.face p{
    font-size:1rem;
    line-height:1.6;
    margin-bottom:25px;
    text-shadow:0 1px 4px rgba(0,0,0,0.4);
}

.face.front{
    transform:translateZ(40px);
}

.face.back{
    transform:rotateY(180deg) translateZ(40px);
}

@keyframes rotate{
    0%{
        transform:rotateY(0deg);
    }
    100%{
        transform:rotateY(360deg);
    }
}

.status{
    margin-top:20px;
    padding:10px 25px;
    border-radius:25px;
    background:#22c55e;
    color:white;
    font-weight:bold;
    font-size:1rem;
    box-shadow:0 0 15px #22c55e;
}
</style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="face front">
            <h1>🐳 Docker Flask</h1>
            <p>
                Flask application is successfully running
                inside Docker Container.
            </p>
            <div class="status">Container Running</div>
        </div>

        <div class="face back">
            <h1>✅ Test Success</h1>
            <p>
                If you can see this rotating card,
                your Docker image, container and Flask
                web server are working correctly.
            </p>
            <div class="status">All Systems Go</div>
        </div>
    </div>
</div>

</body>
</html>
